<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FÁRA Finanzas</title>
<meta name="description" content="Registro de trabajos, gastos y equipo de FÁRA.">
<meta name="theme-color" content="#F2EBDD" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1410" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/simbolo-alt.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FÁRA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top__marca">
      <picture class="solo-fara"><source srcset="icons/logo-negativo.svg" media="(prefers-color-scheme: dark)"><img class="top__logo" src="icons/logo.svg" alt="FÁRA"></picture>
      <span class="solo-personal top__personal">Personal</span>
    </div>
    <div class="top__estado" id="estado"></div>
  </header>
  <div class="modo" id="modo" role="tablist" aria-label="Espacio">
    <button data-a="modo" data-v="fara" role="tab">FÁRA</button>
    <button data-a="modo" data-v="personal" role="tab">Personal</button>
  </div>
  <main id="vista" class="vista"></main>
</div>

<button class="fab" id="fab" aria-label="Cargar nuevo">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="nav" id="nav" aria-label="Secciones"></nav>

<div class="velo" id="velo" hidden></div>
<section class="hoja" id="hoja" role="dialog" aria-modal="true" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="personal.js"></script>
</body>
</html>
